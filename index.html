<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12305c">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tournée">
<title>Tournée</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--bleu:#12305c;--bleu2:#1a57b8;--vert:#1e8e3e;--orange:#e8710a;--gris:#7b8597;--fond:#f4f6fa;--texte:#16202e;--trait:#dfe3ea}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font:17px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--texte);background:var(--fond);-webkit-tap-highlight-color:transparent}
button,.bouton{font:inherit;cursor:pointer}
[hidden]{display:none!important}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
header{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;background:var(--bleu);color:#fff}
#titre{font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%}
#progres{flex:1;min-width:0;font-size:13px}
.jauge{height:6px;background:rgba(255,255,255,.25);border-radius:3px;margin-top:4px;overflow:hidden}
.jauge i{display:block;height:100%;width:0;background:#7ee29a;transition:width .3s}
header button{background:none;border:1px solid rgba(255,255,255,.55);color:#fff;border-radius:10px;min-width:48px;height:42px;font-size:15px;font-weight:600}
#zoneCarte{position:relative;flex:1;min-height:0}
#carte{position:absolute;inset:0}
#btnSuivre{position:absolute;right:12px;bottom:12px;z-index:600;width:52px;height:52px;border-radius:50%;border:none;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.3);font-size:24px;color:var(--gris)}
#btnSuivre[aria-pressed="true"]{color:var(--bleu2)}
#gps{position:absolute;left:12px;right:76px;top:10px;z-index:600;background:#fff3cd;color:#664d03;border-radius:10px;padding:8px 12px;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
#fiche{background:#fff;padding:12px 14px calc(env(safe-area-inset-bottom) + 12px);box-shadow:0 -4px 16px rgba(0,0,0,.12);border-radius:16px 16px 0 0;position:relative;z-index:700;transition:box-shadow .2s}
#fiche.arrive{box-shadow:0 -4px 0 var(--vert),0 -4px 16px rgba(0,0,0,.12)}
.ligne1{display:flex;gap:12px;align-items:center}
.pastille{flex:none;width:44px;height:44px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px}
#adresse{font-weight:700;font-size:19px;line-height:1.2}
#infos{font-size:14px;color:#4a5468;margin-top:2px}
#distance{margin:10px 0;font-size:16px;font-weight:600;color:var(--bleu2)}
#fiche.arrive #distance{color:var(--vert)}
.actions{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:8px}
.actions>*{height:56px;border-radius:12px;font-weight:700;font-size:17px;display:grid;place-items:center;text-decoration:none;border:2px solid transparent}
.secondaire{background:#fff;border-color:var(--trait)!important;color:var(--texte)}
#btnGuider{color:var(--bleu2);border-color:#b9cdf0!important}
.primaire{background:var(--vert);color:#fff}
#fin{text-align:center;padding:6px 0}
#fin h2{margin:4px 0 6px;font-size:20px}
#fin p{margin:0 0 12px;color:#4a5468}
#fin button{width:100%;height:56px;border-radius:12px;border:none}
.pin{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 13px system-ui,sans-serif;color:#fff;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45);transition:transform .15s}
.pin.afaire{background:var(--bleu)}
.pin.courant{background:var(--orange);transform:scale(1.35)}
.pin.fait{background:var(--vert)}
.pin.passe{background:var(--gris)}
/* Carte dezoomee : les immeubles deviennent de petits points, seul l'immeuble en cours garde son numero */
.petit .pin:not(.courant){transform:scale(.42);color:transparent}
#liste,#accueil{position:fixed;inset:0;z-index:1000;background:#fff;overflow:auto;padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 16px)}
.entete{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.entete h2{margin:0;font-size:20px}
.entete button{height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--trait);background:#fff;font-weight:600}
#listeItems{list-style:none;margin:0;padding:0}
#listeItems li{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--trait)}
#listeItems .n{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--bleu);color:#fff;font-weight:700;font-size:14px}
#listeItems li.courant .n{background:var(--orange)}
#listeItems li.depose .n{background:var(--vert)}
#listeItems li.passe .n{background:var(--gris)}
#listeItems li.depose .a,#listeItems li.passe .a{color:var(--gris)}
#listeItems .a{flex:1}
#listeItems .b{color:#4a5468;font-size:14px;font-variant-numeric:tabular-nums}
.outils{display:grid;gap:8px;margin-top:16px}
.outils button,.bouton{height:52px;border-radius:12px;border:1px solid var(--trait);background:#fff;font-weight:600;display:grid;place-items:center;width:100%}
.outils .primaire,.bouton.primaire{border:none;background:var(--vert);color:#fff}
#bilanTexte{width:100%;min-height:150px;font:13px/1.4 ui-monospace,Consolas,monospace;margin-top:8px;border:1px solid var(--trait);border-radius:10px;padding:8px}
#accueil h1{font-size:24px;margin:8px 0}
#accueil p{color:#4a5468}
.coller{display:grid;gap:8px;margin:16px 0}
.coller label{font-weight:600}
.coller input{height:52px;border:1px solid var(--trait);border-radius:12px;padding:0 12px;font:inherit;width:100%;min-width:0}
#tournees{list-style:none;padding:0;margin:16px 0 0}
#tournees li{margin-bottom:8px}
#tournees .bouton{height:auto;min-height:56px;padding:8px 14px;text-align:left;place-items:center start;line-height:1.25}
#tournees .etat{display:block;font-size:13px;font-weight:400;color:#4a5468}
#tournees .termine{color:var(--gris)}
#erreur{color:#a61b1b!important;font-weight:600}
#info{color:var(--vert)!important;font-weight:600}
.aide{font-size:14px;color:#4a5468;background:var(--fond);border-radius:12px;padding:10px 12px;margin:16px 0 0}
#raisons{position:fixed;inset:0;z-index:1100;background:rgba(10,16,28,.45);display:flex;align-items:flex-end}
#raisons .feuille{background:#fff;width:100%;border-radius:16px 16px 0 0;padding:14px 14px calc(env(safe-area-inset-bottom) + 14px)}
#raisons h2{margin:2px 0 10px;font-size:18px}
#raisons .choix{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
#raisons .choix button{height:56px;border-radius:12px;border:1px solid var(--trait);background:#fff;font-weight:600;font-size:15px;color:var(--texte)}
.ligne1 .note{margin-left:auto;flex:none;width:46px;height:46px;border-radius:50%;border:1px solid var(--trait);background:#fff;font-size:20px;color:var(--bleu2)}
#noteTxt{font-size:14px;color:#8a5a00;margin-top:4px}
#toast{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 190px);z-index:1200;background:#1d2433;color:#fff;border-radius:12px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 4px 16px rgba(0,0,0,.3)}
#toast button{background:none;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:8px;height:40px;padding:0 14px;font-weight:700}
.scan{margin:16px 0 0;height:60px!important;font-size:18px}
#scanner{position:fixed;inset:0;z-index:1300;background:#000;display:flex;flex-direction:column}
#scanVideo{flex:1;min-height:0;width:100%;object-fit:cover}
.viseur{position:absolute;left:50%;top:44%;width:min(74vw,58vh);aspect-ratio:1;transform:translate(-50%,-50%);border:3px solid rgba(255,255,255,.9);border-radius:18px;box-shadow:0 0 0 100vmax rgba(0,0,0,.35);pointer-events:none}
#scanTxt{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 16px);margin:0;text-align:center;color:#fff;font-weight:600;text-shadow:0 1px 3px #000}
.scanActions{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 14px calc(env(safe-area-inset-bottom) + 14px);background:#000}
</style>
</head>
<body>
<div id="app" hidden>
  <header>
    <div id="titre">Tournée</div>
    <div id="progres"><span id="progresTxt"></span><div class="jauge"><i id="jauge"></i></div></div>
    <button id="btnScan" type="button" aria-label="Scanner le QR code d’une nouvelle tournée">Scanner</button>
    <button id="btnListe" type="button">Liste</button>
  </header>
  <div id="zoneCarte">
    <div id="carte"></div>
    <div id="gps" hidden></div>
    <button id="btnSuivre" type="button" aria-pressed="true" title="Suivre ma position">◎</button>
  </div>
  <section id="fiche">
    <div id="encours">
      <div class="ligne1">
        <span id="num" class="pastille"></span>
        <div><div id="adresse"></div><div id="infos"></div><div id="noteTxt" hidden></div></div>
        <button id="btnNote" class="note" type="button" aria-label="Ajouter une note">✎</button>
      </div>
      <div id="distance"></div>
      <div class="actions">
        <a id="btnGuider" class="secondaire" target="_blank" rel="noopener">Guider</a>
        <button id="btnPasser" class="secondaire" type="button">Passer</button>
        <button id="btnDepose" class="primaire" type="button">Déposé</button>
      </div>
    </div>
    <div id="fin" hidden>
      <h2>Tournée terminée</h2>
      <p id="finTxt"></p>
      <button class="primaire" type="button" id="btnFinBilan">Envoyer le bilan</button>
    </div>
  </section>
</div>

<div id="liste" hidden>
  <div class="entete"><h2>Arrêts</h2><button id="btnFermer" type="button">Carte</button></div>
  <ul id="listeItems"></ul>
  <div class="outils">
    <button class="primaire" type="button" id="btnBilan">Envoyer le bilan</button>
    <textarea id="bilanTexte" readonly hidden></textarea>
    <button type="button" id="btnScannerListe">Scanner une nouvelle tournée</button>
    <button type="button" id="btnQuitter">Changer de tournée</button>
  </div>
  <p class="aide installer" hidden></p>
</div>

<div id="accueil" hidden>
  <h1>Tournées de boîtage</h1>
  <p id="erreur" hidden></p>
  <p id="info" hidden></p>
  <button class="bouton primaire scan" id="btnScanner" type="button">Scanner le QR code d’une tournée</button>
  <ul id="tournees"></ul>
  <div class="coller">
    <label for="lienColle">Ou collez le lien d’une tournée</label>
    <input id="lienColle" type="text" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Collez le lien ici">
    <button class="bouton" id="btnOuvrirLien" type="button">Ajouter</button>
  </div>
  <p class="aide installer" hidden></p>
</div>

<div id="raisons" hidden>
  <div class="feuille">
    <h2>Pourquoi passer ce numéro ?</h2>
    <div class="choix"></div>
    <button type="button" id="raisonsAnnuler" class="bouton">Annuler</button>
  </div>
</div>

<div id="toast" hidden><span id="toastTxt"></span><button id="toastAnnuler" type="button">Annuler</button></div>

<div id="scanner" hidden>
  <video id="scanVideo" playsinline muted autoplay></video>
  <div class="viseur"></div>
  <p id="scanTxt"></p>
  <div class="scanActions">
    <label class="bouton" for="scanPhoto">Prendre une photo</label>
    <input id="scanPhoto" type="file" accept="image/*" capture="environment" hidden>
    <button type="button" id="scanAnnuler" class="bouton">Annuler</button>
  </div>
</div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const CLE = 'tournee:', DERNIERE = 'tournee-derniere', TRACE = 'tournee-trace:';
const ZOOM_NUMEROS = 17;
let T = null, E = null, seuils = [];
let carte = null, marqueurs = [], trace = null, moi = null, halo = null;
let suivre = true, derniere = null, watchId = null, toastMinuterie = null;
const signale = new Set();

// Stockage local (peut etre indisponible)
const lire = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const ecrire = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
function sauver() { ecrire(CLE + T.id, JSON.stringify({ T, E })); ecrire(DERNIERE, T.id); }
function charger(id) { try { const x = JSON.parse(lire(CLE + id)); return x && x.T ? x : null; } catch (e) { return null; } }
function toutes() {
  const r = [];
  try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith(CLE)) { const x = charger(k.slice(CLE.length)); if (x) r.push(x); } } } catch (e) {}
  return r.sort((a, b) => (b.T.date || '').localeCompare(a.T.date || '') || a.T.nom.localeCompare(b.T.nom, 'fr'));
}

// Lien : #d=<deflate-raw en base64url>, une tournee (v1) ou un lot de tournees (v2).
// Le fragment n'est jamais envoye au serveur.
async function decoder(s) {
  const bin = Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
  const flux = new Blob([bin]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return JSON.parse(await new Response(flux).text());
}
function normaliser(d) {
  if (!d || !d.id || !Array.isArray(d.p) || !d.p.length) throw new Error('format');
  return { id: String(d.id), nom: String(d.nom || 'Tournée'), date: String(d.date || ''),
    p: d.p.map(x => ({ a: String(x[0]), l: String(x[1] || ''), lat: +x[2], lon: +x[3], b: +x[4] || 0, u: Array.isArray(x[5]) ? x[5] : [] })) };
}
function tourneesDuLien(d) {
  if (d && d.v === 2 && Array.isArray(d.t) && d.t.length) return d.t.map(normaliser);
  if (d && d.v === 1) return [normaliser(d)];
  throw new Error('format');
}
// Une tournee deja sur le telephone et renvoyee avec un autre ordre garde ses coches, rattachees a l'adresse.
function reprendreCoches(prev, t) {
  if (!prev) return { courant: 0, etats: {}, notes: {} };
  const cle = s => `${s.a}|${s.l}`;
  const etats = new Map(prev.T.p.map((s, i) => [cle(s), prev.E.etats[i]]));
  const notes = new Map(prev.T.p.map((s, i) => [cle(s), (prev.E.notes || {})[i]]));
  const e = { courant: 0, etats: {}, notes: {} };
  t.p.forEach((s, i) => {
    const x = etats.get(cle(s)); if (x) e.etats[i] = x;
    const n = notes.get(cle(s)); if (n) e.notes[i] = n;
  });
  return e;
}
async function ouvrirCode(code) {
  const liste = tourneesDuLien(await decoder(code));
  for (const t of liste) ecrire(CLE + t.id, JSON.stringify({ T: t, E: reprendreCoches(charger(t.id), t) }));
  if (liste.length === 1) { const x = charger(liste[0].id); if (x) { demarrer(x.T, x.E); return; } }
  accueil('', `${liste.length} tournées ajoutées : choisissez celle du jour.`);
}

// Geometrie et textes
const rad = x => x * Math.PI / 180;
function distance(a, b) {
  const h = Math.sin(rad(b.lat - a.lat) / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(rad(b.lon - a.lon) / 2) ** 2;
  return 2 * 6371000 * Math.asin(Math.sqrt(h));
}
const pluriel = (n, mot) => `${n} ${mot}${n > 1 ? 's' : ''}`;

// Installation sur l'ecran d'accueil
const autonome = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function aideInstaller() {
  const txt = autonome()
    ? 'Nouvelle tournée : touchez « Scanner » et visez le QR code du jour sur l’écran du PC.'
    : IOS
      ? 'Pour l’avoir en appli : touchez le bouton Partager de Safari, puis « Sur l’écran d’accueil ». Ensuite, ajoutez chaque nouvelle tournée avec « Scanner le QR code » dans l’appli.'
      : 'Pour l’avoir en appli : menu ⋮ du navigateur, puis « Installer l’application » ou « Ajouter à l’écran d’accueil ».';
  document.querySelectorAll('.installer').forEach(p => { p.textContent = txt; p.hidden = false; });
}

// Demarrage d'une tournee
function demarrer(t, e) {
  T = t; E = e || { courant: 0, etats: {}, notes: {} };
  if (!E.notes) E.notes = {};
  signale.clear();
  // « Vous y êtes » : au plus la moitie de l'ecart avec l'immeuble voisin le plus proche (entre 12 et 35 m)
  seuils = T.p.map((s, i) => {
    let voisin = Infinity;
    T.p.forEach((o, j) => { if (j !== i) voisin = Math.min(voisin, distance(s, o)); });
    return Math.max(12, Math.min(35, voisin / 2));
  });
  $('#accueil').hidden = true; $('#liste').hidden = true; $('#app').hidden = false;
  $('#titre').textContent = T.nom;
  if (carte) { carte.remove(); carte = null; }
  marqueurs = []; trace = null; moi = null; halo = null;
  carte = L.map('carte', { zoomControl: false });
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(carte);
  carte.on('zoomend', majZoom);
  carte.fitBounds(L.latLngBounds(T.p.map(s => [s.lat, s.lon])).pad(0.12));
  carte.on('dragstart', () => regleSuivi(false));
  trace = L.polyline(T.p.map(s => [s.lat, s.lon]), { color: '#1a57b8', weight: 4, opacity: .5, dashArray: '6 8' }).addTo(carte);
  majZoom();
  majTout();
  suivrePosition();
  chargerTrace();
  setTimeout(() => carte.invalidateSize(), 50);
}
function majZoom() { if (carte) carte.getContainer().classList.toggle('petit', carte.getZoom() < ZOOM_NUMEROS); }

function etatDe(i) { return E.etats[i] ? E.etats[i].s : null; }
function prochain(depuis) {
  const n = T.p.length;
  for (let k = 1; k <= n; k++) { const i = (depuis + k) % n; if (!etatDe(i)) return i; }
  return null;
}

function icone(i) {
  const s = etatDe(i);
  const cls = s === 'depose' ? 'fait' : s === 'passe' ? 'passe' : (i === E.courant ? 'courant' : 'afaire');
  return L.divIcon({ className: '', html: `<div class="pin ${cls}">${s === 'depose' ? '✓' : i + 1}</div>`, iconSize: [30, 30], iconAnchor: [15, 15] });
}
function dessiner() {
  marqueurs.forEach(m => m.remove());
  marqueurs = T.p.map((s, i) => L.marker([s.lat, s.lon], { icon: icone(i), zIndexOffset: i === E.courant ? 1000 : 0 })
    .addTo(carte).on('click', () => { if (!etatDe(i)) { E.courant = i; majTout(); } }));
}

function majTout() { dessiner(); majFiche(); majListe(); sauver(); }

function majFiche() {
  const n = T.p.length;
  const faits = T.p.filter((_, i) => etatDe(i) === 'depose');
  const traites = T.p.filter((_, i) => etatDe(i)).length;
  const proprios = faits.reduce((s, p) => s + p.b, 0);
  $('#progresTxt').textContent = `${faits.length}/${n} immeubles, ${proprios} propr.`;
  $('#jauge').style.width = (100 * traites / n) + '%';
  const termine = traites === n;
  $('#encours').hidden = termine; $('#fin').hidden = !termine;
  if (termine) {
    $('#finTxt').textContent = `${pluriel(faits.length, 'immeuble')} ${faits.length > 1 ? 'déposés' : 'déposé'} sur ${n}, ${pluriel(proprios, 'propriétaire')}.`;
    $('#fiche').classList.remove('arrive');
    return;
  }
  if (E.courant == null || E.courant >= n || etatDe(E.courant)) E.courant = prochain(E.courant == null ? -1 : E.courant);
  const s = T.p[E.courant];
  $('#num').textContent = E.courant + 1;
  $('#adresse').textContent = s.a;
  $('#infos').textContent = `${s.l}, ${pluriel(s.b, 'propriétaire')}`;
  const note = E.notes[E.courant];
  $('#noteTxt').textContent = note ? `✎ ${note}` : '';
  $('#noteTxt').hidden = !note;
  $('#btnGuider').href = `https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lon}&travelmode=walking&dir_action=navigate`;
  majDistance();
}

function majDistance() {
  if (!T || E.courant == null || !T.p[E.courant]) return;
  const s = T.p[E.courant];
  if (!derniere) { $('#distance').textContent = 'Position en attente'; $('#fiche').classList.remove('arrive'); return; }
  const d = distance(derniere, s);
  const arrive = d <= seuils[E.courant];
  $('#fiche').classList.toggle('arrive', arrive);
  if (arrive) {
    $('#distance').textContent = 'Vous y êtes';
    if (!signale.has(E.courant)) { signale.add(E.courant); if (navigator.vibrate) navigator.vibrate([80, 60, 80]); }
  } else {
    $('#distance').textContent = d < 1000 ? `À ${Math.round(d)} m` : `À ${(d / 1000).toFixed(1).replace('.', ',')} km`;
  }
}

function marquer(statut, raison) {
  const i = E.courant;
  if (i == null) return;
  E.etats[i] = { s: statut, t: new Date().toISOString() };
  if (raison) E.etats[i].r = raison;
  const nx = prochain(i);
  E.courant = nx;
  if (navigator.vibrate) navigator.vibrate(statut === 'depose' ? 60 : [30, 40, 30]);
  majTout();
  if (nx != null && suivre === false) carte.panTo([T.p[nx].lat, T.p[nx].lon]);
  toast(`N° ${i + 1} ${statut === 'depose' ? 'déposé' : `passé${raison ? ' : ' + raison : ''}`}`, () => { delete E.etats[i]; E.courant = i; majTout(); });
}

function toast(txt, annuler) {
  $('#toastTxt').textContent = txt;
  $('#toast').hidden = false;
  $('#toastAnnuler').hidden = !annuler;
  $('#toastAnnuler').onclick = () => { $('#toast').hidden = true; if (annuler) annuler(); };
  clearTimeout(toastMinuterie);
  toastMinuterie = setTimeout(() => { $('#toast').hidden = true; }, 5000);
}

// Position
function etatGps(msg) { $('#gps').textContent = msg; $('#gps').hidden = !msg; }
function suivrePosition() {
  if (watchId != null) return;
  if (!('geolocation' in navigator)) { etatGps('Localisation indisponible sur cet appareil'); return; }
  watchId = navigator.geolocation.watchPosition(
    p => positionner(p.coords.latitude, p.coords.longitude, p.coords.accuracy),
    err => etatGps(err.code === 1 ? 'Localisation refusée : autorisez-la pour ce site dans les réglages du téléphone' : 'Position introuvable pour le moment'),
    { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
  garderEcranAllume();
}
function positionner(lat, lon, acc) {
  derniere = { lat, lon, acc };
  etatGps('');
  if (!carte) return;
  if (!moi) {
    halo = L.circle([lat, lon], { radius: acc || 20, color: '#1a73e8', weight: 1, fillOpacity: .12, interactive: false }).addTo(carte);
    moi = L.circleMarker([lat, lon], { radius: 8, color: '#fff', weight: 3, fillColor: '#1a73e8', fillOpacity: 1, interactive: false }).addTo(carte);
  } else { moi.setLatLng([lat, lon]); halo.setLatLng([lat, lon]).setRadius(acc || 20); }
  if (suivre) carte.panTo([lat, lon], { animate: true });
  majDistance();
}
function regleSuivi(v) {
  suivre = v;
  $('#btnSuivre').setAttribute('aria-pressed', String(v));
  if (v && derniere) carte.panTo([derniere.lat, derniere.lon]);
}
async function garderEcranAllume() {
  try { if ('wakeLock' in navigator && document.visibilityState === 'visible') await navigator.wakeLock.request('screen'); } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && T) garderEcranAllume(); });

// Trace a pied par les rues (itineraire pieton OpenStreetMap), garde en memoire ; ligne droite sinon
async function chargerTrace() {
  const id = T.id;
  const coords = T.p.map(s => `${s.lon.toFixed(6)},${s.lat.toFixed(6)}`).join(';');
  // la cle depend de l'ordre des arrets : un nouvel ordre redemande son trace
  let h = 5381; for (let i = 0; i < coords.length; i++) h = ((h * 33) ^ coords.charCodeAt(i)) >>> 0;
  const cle = `${TRACE}${id}:${h.toString(36)}`;
  let geo = null;
  try { geo = JSON.parse(lire(cle)); } catch (e) {}
  if (!geo) {
    try {
      const r = await fetch(`https://routing.openstreetmap.de/routed-foot/route/v1/foot/${coords}?overview=full&geometries=geojson`);
      const j = await r.json();
      if (j.code !== 'Ok') return;
      geo = j.routes[0].geometry.coordinates.map(c => [+c[1].toFixed(6), +c[0].toFixed(6)]);
      ecrire(cle, JSON.stringify(geo));
    } catch (e) { return; }
  }
  if (!T || T.id !== id || !carte) return;
  if (trace) trace.remove();
  trace = L.polyline(geo, { color: '#1a57b8', weight: 5, opacity: .6 }).addTo(carte);
}

// Liste, bilan
function majListe() {
  const ul = $('#listeItems');
  ul.textContent = '';
  T.p.forEach((s, i) => {
    const st = etatDe(i);
    const li = document.createElement('li');
    li.className = st || (i === E.courant ? 'courant' : '');
    const n = document.createElement('span'); n.className = 'n'; n.textContent = st === 'depose' ? '✓' : i + 1;
    const a = document.createElement('span'); a.className = 'a'; a.textContent = s.a + (E.notes[i] ? ' ✎' : '');
    const b = document.createElement('span'); b.className = 'b'; b.textContent = st === 'passe' ? (E.etats[i].r || 'passé') : s.b;
    li.append(n, a, b);
    li.onclick = () => {
      if (st && !confirm(`Remettre le n° ${i + 1} à faire ?`)) return;
      delete E.etats[i]; E.courant = i; $('#liste').hidden = true; majTout();
      regleSuivi(false); carte.setView([s.lat, s.lon], Math.max(carte.getZoom(), ZOOM_NUMEROS), { animate: false });
    };
    ul.appendChild(li);
  });
}
function bilan() {
  const dep = [], pas = [], reste = [];
  T.p.forEach((_, i) => (etatDe(i) === 'depose' ? dep : etatDe(i) === 'passe' ? pas : reste).push(i));
  const proprios = dep.reduce((s, i) => s + T.p[i].b, 0);
  const notes = Object.entries(E.notes || {}).filter(([, t]) => t);
  const lignes = [
    `Bilan tournée ${T.nom} (${T.id})`,
    `Déposé : ${pluriel(dep.length, 'immeuble')}, ${pluriel(proprios, 'propriétaire')}`,
    `Passé : ${pas.length}${pas.length ? ' (' + pas.map(i => `n° ${i + 1} ${E.etats[i].r || 'sans raison'}`).join(', ') + ')' : ''}`,
    `Reste : ${reste.length}${reste.length ? ' (n° ' + reste.map(i => i + 1).join(', ') + ')' : ''}`,
  ];
  if (notes.length) lignes.push('Notes : ' + notes.map(([i, t]) => `n° ${+i + 1} ${T.p[i].a} : ${t}`).join(' ; '));
  // Ligne de données reprise telle quelle par Claude pour mettre le CRM à jour.
  const donnees = { tournee: T.id, depose: dep.flatMap(i => T.p[i].u), passe: {}, notes: [] };
  pas.forEach(i => { const r = E.etats[i].r || 'Sans raison'; (donnees.passe[r] = donnees.passe[r] || []).push(...T.p[i].u); });
  notes.forEach(([i, t]) => donnees.notes.push({ adresse: T.p[i].a, texte: t, uids: T.p[i].u }));
  lignes.push('', 'Pour le CRM : ' + JSON.stringify(donnees));
  return lignes.join('\n');
}
async function envoyerBilan() {
  const txt = bilan();
  if (navigator.share) {
    try { await navigator.share({ title: `Bilan tournée ${T.nom}`, text: txt }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  try { await navigator.clipboard.writeText(txt); toast('Bilan copié, collez-le dans un message'); return; } catch (e) {}
  $('#liste').hidden = false; $('#bilanTexte').hidden = false; $('#bilanTexte').value = txt; $('#bilanTexte').select();
}

// Accueil : les tournees du telephone
function accueil(erreur, info) {
  $('#app').hidden = true; $('#liste').hidden = true; $('#accueil').hidden = false;
  $('#erreur').textContent = erreur || ''; $('#erreur').hidden = !erreur;
  $('#info').textContent = info || ''; $('#info').hidden = !info;
  aideInstaller();
  const ul = $('#tournees'); ul.textContent = '';
  toutes().forEach(x => {
    const n = x.T.p.length, traites = x.T.p.filter((_, i) => x.E.etats[i]).length;
    const li = document.createElement('li');
    const b = document.createElement('button'); b.type = 'button'; b.className = 'bouton' + (traites === n ? ' termine' : '');
    const titre = document.createElement('span'); titre.textContent = x.T.nom;
    const etat = document.createElement('span'); etat.className = 'etat';
    etat.textContent = `${pluriel(n, 'immeuble')}, ${traites === 0 ? 'pas commencée' : traites === n ? 'terminée' : `${traites}/${n} faits`}`;
    b.append(titre, etat);
    b.onclick = () => demarrer(x.T, x.E);
    li.appendChild(b); ul.appendChild(li);
  });
}

$('#btnDepose').onclick = () => marquer('depose');
// « Passer » demande une raison : elle revient dans le bilan et dans le CRM.
const RAISONS = ['Pas de publicité', 'Entrée à code', 'Boîtes pleines', 'Panneau À vendre', 'Immeuble introuvable', 'Autre'];
RAISONS.forEach(r => {
  const b = document.createElement('button'); b.type = 'button'; b.textContent = r;
  b.onclick = () => { $('#raisons').hidden = true; marquer('passe', r); };
  $('#raisons .choix').appendChild(b);
});
$('#btnPasser').onclick = () => { if (E && E.courant != null) $('#raisons').hidden = false; };
$('#raisonsAnnuler').onclick = () => { $('#raisons').hidden = true; };
$('#btnNote').onclick = () => {
  const i = E && E.courant;
  if (i == null) return;
  const texte = prompt(`Note pour le n° ${i + 1} (${T.p[i].a})`, E.notes[i] || '');
  if (texte === null) return;
  if (texte.trim()) E.notes[i] = texte.trim(); else delete E.notes[i];
  majTout();
};
$('#btnSuivre').onclick = () => regleSuivi(!suivre);
$('#btnListe').onclick = () => { majListe(); aideInstaller(); $('#toast').hidden = true; $('#bilanTexte').hidden = true; $('#liste').hidden = false; };
$('#btnFermer').onclick = () => { $('#liste').hidden = true; setTimeout(() => carte && carte.invalidateSize(), 50); };
$('#btnBilan').onclick = envoyerBilan;
$('#btnFinBilan').onclick = envoyerBilan;
$('#btnQuitter').onclick = () => accueil();
$('#btnOuvrirLien').onclick = async () => {
  const m = $('#lienColle').value.trim().match(/[#&]d=([A-Za-z0-9_-]+)/);
  if (!m) { accueil('Ce lien ne contient pas de tournée'); return; }
  try { $('#lienColle').value = ''; await ouvrirCode(m[1]); }
  catch (e) { accueil('Lien de tournée illisible ou incomplet'); }
};

// Scanner le QR code d'une tournee (ecran du PC ou page imprimee) : elle arrive directement dans l'appli
// installee, sans passer par le navigateur. Lecteur du telephone s'il existe (Android), sinon ZXing (iPhone) :
// sur un QR de tournee dense, flou et granuleux, ZXing lit en 0,1 s ce que jsQR ne lisait pas (essais du 11 sept.).
const ZXING = 'https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.4/dist/iife/reader/index.js';
const ZXING_WASM = 'https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.4/dist/reader/zxing_reader.wasm';
let flux = null, scanActif = false, detecteur, zxingPromesse = null;
function chargerZXing() {
  if (!zxingPromesse) {
    zxingPromesse = new Promise((ok, ko) => {
      const s = document.createElement('script'); s.src = ZXING; s.async = true;
      s.onload = () => {
        const Z = window.ZXingWASM;
        if (!Z) { ko(new Error('zxing')); return; }
        Z.prepareZXingModule({ overrides: { locateFile: (p, prefixe) => (p.endsWith('.wasm') ? ZXING_WASM : prefixe + p) } });
        ok(Z);
      };
      s.onerror = () => ko(new Error('zxing'));
      document.head.appendChild(s);
    }).catch(e => { zxingPromesse = null; throw e; });
  }
  return zxingPromesse;
}
async function lecteurNatif() {
  if (detecteur !== undefined) return detecteur;
  detecteur = null;
  try {
    if ('BarcodeDetector' in window && (await BarcodeDetector.getSupportedFormats()).includes('qr_code')) detecteur = new BarcodeDetector({ formats: ['qr_code'] });
  } catch (e) {}
  return detecteur;
}
const toile = document.createElement('canvas');
// Texte du QR code d'une image (video, photo ou toile), null s'il n'y en a pas.
// Un QR de tournee est dense (plus de 100 modules) : lecture en pleine definition (1920 px au plus),
// puis a moitie taille, qui rattrape les images tres floues (le flou y devient plus fin que les modules).
async function lireQR(source, largeur, hauteur) {
  const natif = await lecteurNatif();
  if (natif) {
    try { const r = await natif.detect(source); return r.length ? r[0].rawValue : null; } catch (e) { detecteur = null; }
  }
  const Z = await chargerZXing();
  const k = Math.min(1, 1920 / Math.max(largeur, hauteur));
  const cx = toile.getContext('2d', { willReadFrequently: true });
  for (const f of [k, k / 2]) {
    toile.width = Math.round(largeur * f); toile.height = Math.round(hauteur * f);
    cx.drawImage(source, 0, 0, toile.width, toile.height);
    const r = await Z.readBarcodes(cx.getImageData(0, 0, toile.width, toile.height), { formats: ['QRCode'], tryHarder: true, maxNumberOfSymbols: 1 });
    const bon = r.find(b => b.isValid !== false && b.text);
    if (bon) return bon.text;
  }
  return null;
}
async function codeScanne(texte) {
  const m = String(texte || '').match(/[#&]d=([A-Za-z0-9_-]+)/);
  if (!m) { $('#scanTxt').textContent = 'Ce QR code n’est pas une tournée'; return false; }
  fermerScanner();
  if (navigator.vibrate) navigator.vibrate(80);
  try { await ouvrirCode(m[1]); } catch (e) { accueil('QR code de tournée illisible ou incomplet'); }
  return true;
}
async function ouvrirScanner() {
  $('#toast').hidden = true;
  $('#scanTxt').textContent = 'Agrandissez le QR code sur l’écran du PC, puis remplissez le cadre avec';
  $('#scanner').hidden = false;
  chargerZXing().catch(() => {});
  try {
    flux = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
  } catch (e) {
    $('#scanTxt').textContent = e && e.name === 'NotAllowedError'
      ? 'Caméra refusée : autorisez-la pour ce site dans les réglages, ou prenez une photo du QR code'
      : 'Caméra indisponible : prenez une photo du QR code';
    return;
  }
  if ($('#scanner').hidden) { fermerScanner(); return; }
  const v = $('#scanVideo');
  v.srcObject = flux;
  try { await v.play(); } catch (e) {}
  scanActif = true;
  boucleScan();
}
async function boucleScan() {
  const v = $('#scanVideo');
  while (scanActif) {
    let pause = 250;
    if (v.readyState >= 2 && v.videoWidth) {
      try { const t = await lireQR(v, v.videoWidth, v.videoHeight); if (t && await codeScanne(t)) return; }
      catch (e) { $('#scanTxt').textContent = 'Lecteur de QR code indisponible : vérifiez la connexion'; pause = 2000; }
    }
    await new Promise(r => setTimeout(r, pause));
  }
}
function fermerScanner() {
  scanActif = false;
  if (flux) { flux.getTracks().forEach(t => t.stop()); flux = null; }
  $('#scanVideo').srcObject = null;
  $('#scanner').hidden = true;
}
$('#btnScanner').onclick = ouvrirScanner;
$('#btnScannerListe').onclick = () => { $('#liste').hidden = true; ouvrirScanner(); };
$('#btnScan').onclick = ouvrirScanner;
$('#scanAnnuler').onclick = fermerScanner;
$('#scanPhoto').onchange = async e => {
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!f) return;
  $('#scanTxt').textContent = 'Lecture de la photo…';
  try {
    const img = await createImageBitmap(f);
    const t = await lireQR(img, img.width, img.height);
    if (!t) { $('#scanTxt').textContent = 'Aucun QR code lu sur la photo : rapprochez-vous et réessayez'; return; }
    await codeScanne(t);
  } catch (err) { $('#scanTxt').textContent = 'Photo illisible, réessayez'; }
};

// Test sur ordinateur : window.tournee.simuler(lat, lon) ; window.tournee.scannerImage(toile)
window.tournee = { simuler: (lat, lon, acc = 10) => positionner(lat, lon, acc), etat: () => ({ T, E, derniere, seuils }),
  scannerImage: async source => codeScanne(await lireQR(source, source.width, source.height)) };

// Un lien peut arriver au chargement ou dans une page deja ouverte (seul le # change).
async function lireLien() {
  const m = location.hash.match(/[#&]d=([^&]+)/);
  if (!m) return false;
  try {
    const code = m[1];
    history.replaceState(null, '', location.pathname + location.search);
    await ouvrirCode(code);
  } catch (e) { accueil('Lien de tournée illisible ou incomplet'); }
  return true;
}
window.addEventListener('hashchange', lireLien);

(async function lancer() {
  if (await lireLien()) return;
  const id = lire(DERNIERE);
  const x = id && charger(id);
  if (x) { demarrer(x.T, x.E); return; }
  accueil();
})();
